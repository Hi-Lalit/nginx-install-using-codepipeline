version: 0.2

phases:
  pre_build:
    commands:
      - echo Installing Nginx
      - apt-get update && apt-get install -y nginx
  
  build:
    commands:
      - echo build started on `date`
      - cp ./webapp-nginx/index.html /usr/share/nginx/html/index.html
      - cp ./webapp-nginx/error_404.html /usr/share/nginx/html/error_404.html
      - cp ./webapp-nginx/nginx.conf /etc/nginx/nginx.conf    

  post_build:
    commands:
      - echo "Build completed on `date`"
      
artifacts:
  files:
    - '**/*'
    